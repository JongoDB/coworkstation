#cloud-config
# Coworkstation — first-boot bootstrap for a VPS/mini-PC.
#
# Before use, replace the two placeholders:
#   __HOSTNAME__   public hostname (e.g. claude.example.com)
#   __ADMIN_KEY__  the admin's SSH public key
#
# What this does: creates the first member account, clones the repo,
# and runs setup.sh. Interactive steps (cloudflared tunnel
# login, Access policy, Claude sign-in) remain manual by design —
# they involve credentials that don't belong in user-data. The
# first-boot README on the box lists them.
#
# Spec: docs/phases.md (Phase 5)

# Stop the distro's first-boot apt-daily/unattended-upgrade jobs from
# holding the dpkg lock while cloud-init installs — that contention can
# stall provisioning for many minutes on a fresh cloud image. cloud-init
# re-enables nothing; setup.sh turns unattended-upgrades back on itself.
bootcmd:
  - systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
  - systemctl disable --now apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - ca-certificates

users:
  - name: cowork
    shell: /bin/bash
    groups: [users]
    lock_passwd: true
  - name: admin
    shell: /bin/bash
    groups: [sudo]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - __ADMIN_KEY__

write_files:
  - path: /etc/motd
    append: true
    content: |
      ── Coworkstation ────────────────────────────────────────
      Provisioned by cloud-init (manual tunnel mode). Next steps:
        1. EITHER re-run zero-touch: put a scoped CF token in a
           0600 root file, then
             sudo /opt/coworkstation/setup.sh \
               --hostname __HOSTNAME__ \
               --cf-api-token-file /root/cf-token \
               --access-allow you@example.com
           OR finish manually: cloudflared tunnel login/create,
           /etc/cloudflared/config.yml, route DNS, install svc,
           and add a Cloudflare Access policy for __HOSTNAME__
        2. kasmVNC password: sudo cat ~cowork/.vnc/kasm-credentials
        3. open https://__HOSTNAME__ , pass Access, sign into Claude
        4. sudo /opt/coworkstation/setup.sh doctor --user cowork
      Runbook: /opt/coworkstation/docs/runbook.md

runcmd:
  - git clone --depth 1
    https://github.com/jongodb/coworkstation
    /opt/coworkstation
  - /opt/coworkstation/setup.sh
    --user cowork --hostname __HOSTNAME__
  - /opt/coworkstation/setup.sh doctor --user cowork
    || true
