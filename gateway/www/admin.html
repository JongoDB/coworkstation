<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>Coworkstation · Admin</title>
<style>
  :root { color-scheme: dark; --brand: #dd6042; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1c1c1c; color: #ececec;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-bottom: 1px solid #2c2c2c; }
  header img { width: 28px; height: 28px; border-radius: 8px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
  header a.home { color: var(--brand); text-decoration: none; font-size: 13px; }
  nav.tabs { display: flex; gap: 4px; padding: 10px 14px 0;
    border-bottom: 1px solid #2c2c2c; position: sticky; top: 0; background: #1c1c1c; }
  nav.tabs a { text-decoration: none; color: #9a9a9a; font-size: 14px;
    padding: 9px 14px; border-radius: 10px 10px 0 0; }
  nav.tabs a.active { color: #fff; background: #262626;
    box-shadow: inset 0 -2px 0 var(--brand); }
  main { padding: 18px; max-width: 900px; margin: 0 auto; }
  .stale { color: #6f6f6f; font-size: 12px; margin: 0 0 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #2a2a2a; }
  th { color: #8a8a8a; font-weight: 500; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; }
  .pill.active { background: #1e3a2a; color: #7fd6a2; }
  .pill.idle { background: #3a2f1e; color: #d6b87f; }
  .pill.down { background: #3a1e1e; color: #d67f7f; }
  .muted { color: #7a7a7a; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
    color: #8a8a8a; margin: 22px 0 8px; }
  ul.feed { list-style: none; padding: 0; margin: 0; }
  ul.feed li { padding: 8px 0; border-bottom: 1px solid #262626; font-size: 13px; }
  ul.feed time { color: #6f6f6f; margin-right: 8px; }
  .empty { color: #6f6f6f; padding: 12px 0; }
  .panel { display: none; }
  .panel.active { display: block; }
  button.ghost { background: #262626; color: #7a7a7a; border: 1px dashed #3a3a3a;
    border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-top: 14px;
    cursor: not-allowed; width: 100%; }
  .note { color: #6f6f6f; font-size: 12px; margin-top: 8px; }
  button.act { font-size: 12px; font-weight: 600; padding: 5px 11px; margin: 0 4px 0 0;
    border-radius: 8px; border: 1px solid #3a3a3a; background: #262626; color: #ececec;
    cursor: pointer; }
  button.act.danger { border-color: #5a2a2a; color: #e08a8a; }
  button.act:disabled { opacity: .5; cursor: default; }
  .bar { display: flex; gap: 10px; align-items: center; margin: 0 0 14px; flex-wrap: wrap; }
  .bar button { font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 10px;
    border: 1px solid #3a3a3a; background: #262626; color: #ececec; cursor: pointer; }
  form.add { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 0 0 16px; }
  form.add input { background: #262626; border: 1px solid #333; border-radius: 10px;
    color: #fff; padding: 10px 12px; font: inherit; }
  form.add input.wide { grid-column: 1 / -1; }
  form.add button { grid-column: 1 / -1; background: var(--brand); color: #fff; border: 0;
    border-radius: 10px; padding: 11px; font-weight: 600; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 12px; padding: 12px 18px;
    max-width: 90%; font-size: 13px; display: none; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #toast.err { border-color: #5a2a2a; color: #e08a8a; }
  #toast.ok { border-color: #2a5a3a; color: #8ad6a2; }
</style>
</head>
<body>
  <header>
    <img src="/cws-icon-512.png" alt="">
    <h1>Admin</h1>
    <a class="home" href="/home">← Home</a>
  </header>
  <nav class="tabs">
    <a data-tab="monitoring" href="#monitoring">Monitoring</a>
    <a data-tab="devices" href="#devices">Devices</a>
    <a data-tab="members" href="#members">Members</a>
  </nav>
  <main>
    <p class="stale" id="stale"></p>

    <section class="panel" id="tab-monitoring">
      <div class="bar"><button data-act="reclaim">Reclaim idle sessions</button></div>
      <table><thead><tr><th>Member</th><th>State</th><th>Display</th>
        <th>Usage (tokens)</th><th>Session</th></tr></thead>
        <tbody id="members"></tbody></table>
      <h2>Recent activity</h2>
      <ul class="feed" id="audit"></ul>
    </section>

    <section class="panel" id="tab-devices">
      <table><thead><tr><th>Member</th><th>Device</th><th>Last seen</th></tr></thead>
        <tbody id="devicerows"></tbody></table>
    </section>

    <section class="panel" id="tab-members">
      <form class="add" id="addForm" autocomplete="off">
        <input name="user" placeholder="name (a–z, 0–9, - _)" required>
        <input name="mem" placeholder="mem e.g. 6G" required>
        <input name="cpu" placeholder="cpu e.g. 200%" required>
        <input name="allow" class="wide" placeholder="Access allow-list (optional): email or domain">
        <button type="submit">Add member</button>
      </form>
      <table><thead><tr><th>Member</th><th>Display</th><th>State</th><th></th></tr></thead>
        <tbody id="roster"></tbody></table>
    </section>
    <div id="toast"></div>
  </main>
  <script src="/admin/cws-admin.js"></script>
</body>
</html>
