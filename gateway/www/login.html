<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>Coworkstation</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/cws-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Coworkstation">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #1c1c1c; color: #ececec;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px
             max(24px, env(safe-area-inset-bottom));
  }
  .card { width: 100%; max-width: 360px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; color: #9a9a9a; font-size: 14px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input[type=password] {
    width: 100%; padding: 14px 16px; font-size: 16px;
    background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 12px;
    color: #fff; outline: none;
  }
  input[type=password]:focus { border-color: #6b6b6b; }
  button {
    width: 100%; padding: 14px 16px; font-size: 16px; font-weight: 600;
    background: #ececec; color: #1c1c1c; border: 0; border-radius: 12px;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .err { color: #ff8a80; font-size: 14px; min-height: 20px; margin: 4px 0 0; }
  .hint { margin-top: 24px; color: #6f6f6f; font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <img class="mark" src="/cws-icon.svg" alt="">
    <h1>Coworkstation</h1>
    <p class="sub">Sign in to your workspace</p>
    <form method="POST" action="/cws-login" autocomplete="on">
      <input type="password" name="password" placeholder="Password"
             aria-label="Password" autofocus required>
      <input type="hidden" name="dpr" id="dpr" value="1">
      <button type="submit">Continue</button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <p class="hint" id="hint"></p>
  </main>
  <script src="/cws-app.js"></script>
</body>
</html>
