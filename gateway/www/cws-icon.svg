<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Coworkstation">
  <!-- Maskable: keep the mark inside the central safe zone. -->
  <rect width="512" height="512" rx="112" fill="#1c1c1c"/>
  <!-- Two linked rounded arcs — a simple "co-work" mark, not derived from
       any product logo. -->
  <g fill="none" stroke="#ececec" stroke-width="34" stroke-linecap="round">
    <path d="M300 176a96 96 0 1 0 0 160"/>
    <path d="M212 336a96 96 0 1 0 0-160"/>
  </g>
</svg>
