name: Release

# Creates the annotated tag and the GitHub Release from CI, so a
# release never depends on an environment that can push tags. Run it
# from the Actions tab (workflow_dispatch) with the version to cut.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0 — no leading v)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and changelog
        run: |
          v='${{ inputs.version }}'
          if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$v' is not X.Y.Z" >&2
            exit 1
          fi
          if git rev-parse "v$v" > /dev/null 2>&1; then
            echo "tag v$v already exists" >&2
            exit 1
          fi
          if ! grep -q "^## \[$v\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$v]' section — promote" \
              "[Unreleased] first" >&2
            exit 1
          fi

      - name: Run the test gate
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq
          shellcheck -x \
            install.sh cws libexec/cws-launch client/cws-client setup.sh member.sh storage.sh gen-sshconfigs.sh \
            testbench/setup.sh lib/*.sh lib/profiles/*.sh
          bats --print-output-on-failure \
            tests/clientbridge.bats tests/clientsync.bats tests/common.bats tests/launch.bats tests/cws.bats tests/engine.bats tests/doctor.bats \
            tests/install.bats \
            tests/kasmvnc.bats \
            tests/member.bats tests/storage.bats tests/setup.bats \
            tests/sshconfigs.bats tests/tunnel-api.bats

      - name: Extract release notes from CHANGELOG
        run: |
          v='${{ inputs.version }}'
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > /tmp/notes.md
          echo "--- notes ---"; cat /tmp/notes.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ inputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email \
            'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$v" -m "Coworkstation v$v"
          git push origin "v$v"
          gh release create "v$v" \
            --title "Coworkstation v$v" \
            --notes-file /tmp/notes.md
